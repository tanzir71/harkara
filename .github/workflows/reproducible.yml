name: Reproducible build check
# Builds the unsigned release APKs twice from clean checkouts on separate runners and compares them entry
# by entry. Informational only: it never gates a release (results are recorded in docs/RELEASING.md).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        run: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Build unsigned release APKs (no Gradle cache, so each build is from scratch)
        run: ./gradlew --no-build-cache :app:assembleRelease -PharkaraAbiSplits=true
      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.run }}
          path: app/build/outputs/apk/release/*.apk
  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: apks-a, path: a }
      - uses: actions/download-artifact@v4
        with: { name: apks-b, path: b }
      - run: python3 tools/compare_apks.py a b --summary "$GITHUB_STEP_SUMMARY"
