name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core, unit + screenshot verify, lint, assemble
        run: ./gradlew :core:test :app:testDebugUnitTest -Proborazzi.test.verify=true :app:lintDebug :app:assembleDebug --stacktrace
      - name: APK size budget (unsigned release, 30 MB per ABI)
        run: |
          ./gradlew :app:assembleRelease -PharkaraAbiSplits=true
          node tools/check-apk-size.mjs
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/outputs/roborazzi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Tokens and icons are up to date
        run: |
          node tools/build-tokens.mjs --check
          node tools/icons-to-vectors.mjs --check

  site:
    # Landing site: build without network (coming-soon state) and with the release fixture; static checks + Playwright for both.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Coming-soon state
        run: |
          node tools/build-site.mjs --offline
          node tools/verify-site.mjs
          npx playwright test
      - name: Release state (fixture)
        run: |
          node tools/build-site.mjs --release-file tools/fixtures/release-v0.1.0.json
          node tools/verify-site.mjs
          npx playwright test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: artifacts/site-screenshots
          if-no-files-found: ignore
          retention-days: 7

  emulator:
    # Optional: instrumented tests on an emulator. Allowed to fail, never gates anything.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest || true
