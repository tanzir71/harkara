name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate (docs/RELEASING.md). A mismatch fails the release.
  EXPECTED_CERT_SHA256: b1f7c2e3971e6c0767de07784938911a66a15f4185cd6bdfef96d2bbbc3bd1b7

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          HARKARA_KEYSTORE_B64: ${{ secrets.HARKARA_KEYSTORE_B64 }}
        run: |
          echo "$HARKARA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/harkara-release.jks"
          echo "HARKARA_KEYSTORE_PATH=$RUNNER_TEMP/harkara-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APKs (arm64-v8a, armeabi-v7a, universal)
        env:
          HARKARA_KEYSTORE_PASS: ${{ secrets.HARKARA_KEYSTORE_PASS }}
          HARKARA_KEY_ALIAS: ${{ secrets.HARKARA_KEY_ALIAS }}
          HARKARA_KEY_PASS: ${{ secrets.HARKARA_KEY_PASS }}
        run: ./gradlew :app:assembleRelease -PharkaraVersion=${{ steps.tag.outputs.version }} -PharkaraAbiSplits=true --stacktrace
      - name: Rename, verify signatures
        run: |
          set -euo pipefail
          V=${{ steps.tag.outputs.version }}
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/harkara-$V-$abi.apk"
          done
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/certs.txt
            grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/certs.txt
          done
      - name: SHA256SUMS, latest.json, notes
        run: node tools/release-meta.mjs --version ${{ steps.tag.outputs.version }} --dist dist --repo ${{ github.repository }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS dist/latest.json --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS dist/latest.json \
              --title "Harkara ${{ steps.tag.outputs.version }}" --notes-file dist/notes.md --latest
          fi
      - name: Rebuild the landing site with the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
